<!doctype html>
<!-- ファイル概要: テラス可視化画面のHTML構造と操作部品を定義する。 -->
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>テラス | Kashiwa After Dark</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css?v=20261123-ring-fields1" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.166.1/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.166.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main id="app" class="model-only">
      <canvas id="map" aria-label="テラス周辺の拡大3Dマップ"></canvas>
      <div class="model-mode-tools" hidden>
      <nav class="model-screen-navigation" aria-label="画面切り替え">
        <a href="../space-time-cube/" aria-label="タイムキューブ" data-tooltip="タイムキューブ"><i data-view-icon="route"></i></a>
        <a href="../statistics/" aria-label="統計" data-tooltip="統計"><i data-view-icon="chart-no-axes-combined"></i></a>
      </nav>
      <nav class="model-view-switch" aria-label="表示切り替え">
        <span class="view-switch-knob" aria-hidden="true"></span>
        <button type="button" data-map-view="3d" aria-label="3D地図" aria-pressed="true" data-tooltip="3D地図"><i data-view-icon="box"></i></button>
        <button type="button" data-map-view="2d" aria-label="上からの2D地図" aria-pressed="false" data-tooltip="上からの2D地図"><i data-view-icon="map"></i></button>
        <button type="button" aria-label="サンキー図（準備中）" data-tooltip="サンキー図（準備中）" disabled><i data-view-icon="git-fork"></i></button>
      </nav>
      </div>
      <section class="people-period-control" aria-label="観察の時間帯" hidden>
        <div class="period-dial" role="group" aria-label="表示する時間帯">
          <svg class="period-dial-scale" viewBox="0 0 140 140" aria-hidden="true">
            <circle cx="70" cy="70" r="39"/>
            <text x="70" y="12">18</text><text x="124" y="74">20</text>
            <text x="70" y="137">22</text><text x="15" y="74">24</text>
            <path d="M105 35l5 -5 M105 105l5 5 M35 105l-5 5"/>
          </svg>
          <button type="button" data-people-period="0" aria-pressed="true" aria-label="18–20"><svg viewBox="0 0 140 140" aria-hidden="true"><path class="period-arc-track" d="M81.91 25.57 A46 46 0 0 1 114.43 58.09"/><path class="period-arc-progress" d="M81.91 25.57 A46 46 0 0 1 114.43 58.09" pathLength="100" stroke-dasharray="0 100"/></svg></button>
          <button type="button" data-people-period="1" aria-pressed="false" aria-label="20–22"><svg viewBox="0 0 140 140" aria-hidden="true"><path class="period-arc-track" d="M81.91 25.57 A46 46 0 0 1 114.43 58.09"/><path class="period-arc-progress" d="M81.91 25.57 A46 46 0 0 1 114.43 58.09" pathLength="100" stroke-dasharray="0 100"/></svg></button>
          <button type="button" data-people-period="2" aria-pressed="false" aria-label="22–24"><svg viewBox="0 0 140 140" aria-hidden="true"><path class="period-arc-track" d="M81.91 25.57 A46 46 0 0 1 114.43 58.09"/><path class="period-arc-progress" d="M81.91 25.57 A46 46 0 0 1 114.43 58.09" pathLength="100" stroke-dasharray="0 100"/></svg></button>
          <div class="period-dial-center">
            <span id="selected-people-period" aria-hidden="true">18–20</span>
            <button type="button" id="people-demo-pause" aria-label="時間帯の自動送りを一時停止" disabled><i data-period-icon="pause"></i></button>
          </div>
        </div>
      </section>
      <section id="terrace-inspection" aria-label="観察記録の詳細" hidden>
        <div class="inspection-heading">
          <header>
            <h2></h2>
            <strong class="ring-inspection-tag" hidden></strong>
            <button type="button" aria-label="観察記録を閉じる" title="観察記録を閉じる" hidden><i data-inspection-icon="x"></i></button>
          </header>
          <p class="inspection-caption"></p>
        </div>
        <ul aria-label="観察記録"></ul>
      </section>
      <header class="header">
        <a class="brand" href="../space-time-cube/" title="スペースタイムキューブへ戻る">KASHIWA AFTER DARK<span>TERRACE MAP</span></a>
        <button id="data-toggle" class="data-toggle" type="button" aria-label="観察データの表示切替" aria-expanded="true" aria-controls="observations"><i data-lucide="list"></i><span>観察データ</span><b id="data-count">—</b></button>
      </header>
      <section class="place-title" aria-label="表示対象">
        <span class="eyebrow"><i></i> FOCUS AREA</span>
        <h1>テラス</h1>
        <p>駅前デッキ・プラザ前</p><p>場所コードの範囲に対応 · GPS未校正</p>
      </section>
      <section class="people-controls" aria-label="行動の模式表示">
        <div><label><input id="show-people" type="checkbox" checked />人型デモ</label><span id="people-status" role="status">読み込み中</span><button id="pause-people" class="icon-button" type="button" aria-label="人型アニメーションを一時停止" aria-pressed="false"></button></div>
        <p>模式表示 · 人数・服装・軌跡は再現しません</p>
        <p id="people-flow-status" role="status"></p>
      </section>
      <div class="north" aria-label="北の方角（未校正）" hidden><span id="north-arrow">↑</span><b>N</b></div>
      <aside id="observations" aria-label="テラスの観察データ">
        <div class="observations-heading"><div><h2>観察データ</h2><p><span id="survey-date">—</span> · TR</p></div><output id="observation-count">—件</output><button id="reload-data" class="icon-button" type="button" aria-label="観察データを再読み込み" title="観察データを再読み込み"><i data-lucide="refresh-cw"></i></button></div>
        <div class="data-filters">
          <div class="period-filter" role="group" aria-label="観察時間帯"><button type="button" data-period="all" aria-pressed="true">すべて</button><button type="button" data-period="0" aria-pressed="false">18–20</button><button type="button" data-period="1" aria-pressed="false">20–22</button><button type="button" data-period="2" aria-pressed="false">22–24</button></div>
          <select id="place-code" aria-label="場所" disabled><option value="all">場所：すべて</option></select>
        </div>
        <p id="observation-status" role="status">観察データを読み込み中</p>
        <div class="observation-tabs" role="tablist" aria-label="観察データの表示"><button id="tab-places" type="button" role="tab" aria-selected="true" aria-controls="place-summary" data-observation-tab="places">場所比較</button><button id="tab-records" type="button" role="tab" aria-selected="false" aria-controls="record-content" tabindex="-1" data-observation-tab="records">観察一覧</button></div>
        <div class="observation-scroll"><section id="place-summary" role="tabpanel" aria-labelledby="tab-places"></section><section id="record-content" role="tabpanel" aria-labelledby="tab-records" hidden><section id="observation-detail" aria-label="選択した観察記録" hidden></section><ul id="observation-list" aria-label="観察記録の一覧"></ul></section></div>
      </aside>
      <section class="map-controls" aria-label="地図操作">
        <div class="view-switch" role="group" aria-label="地図の視点">
          <button type="button" id="view-3d" aria-pressed="true">3D</button>
          <button type="button" id="view-2d" aria-pressed="false">2D</button>
        </div>
        <span class="divider"></span>
        <button class="icon-button" type="button" id="auto-camera" title="自動カメラを開始" aria-label="自動カメラを開始" aria-pressed="false"><i data-lucide="orbit"></i></button>
        <button class="icon-button" type="button" id="station-monitor" title="駅前モニターを見る" aria-label="駅前モニターを見る"><i data-lucide="monitor"></i></button>
        <button class="icon-button" type="button" id="zoom-in" title="拡大" aria-label="拡大"><i data-lucide="zoom-in"></i></button>
        <button class="icon-button" type="button" id="zoom-out" title="縮小" aria-label="縮小"><i data-lucide="zoom-out"></i></button>
        <button class="icon-button" type="button" id="reset-view" title="テラス全体に戻す" aria-label="テラス全体に戻す"><i data-lucide="locate-fixed"></i></button>
        <button class="icon-button" type="button" id="fullscreen" title="全画面表示" aria-label="全画面表示" aria-pressed="false"><i data-lucide="maximize"></i></button>
      </section>
      <footer class="footer">
        <div class="focus-key"><i></i><span>テラス</span><small>teras.glb</small></div>
        <label class="context-toggle"><input id="show-context" type="checkbox" checked /><span>駅・プラザを表示</span></label>
        <output id="view-status">斜め視点</output>
      </footer>
      <div class="load-state" id="load-state" role="status"><span class="spinner"></span><p id="load-message">地図を読み込み中</p><button id="retry" type="button" hidden>再読み込み</button></div>
      <noscript><p class="noscript">地図を表示するにはJavaScriptを有効にしてください。</p></noscript>
    </main>
    <script type="module" src="./js/modelOnly.js?v=20261123-ring-fields1"></script>
  </body>
</html>
