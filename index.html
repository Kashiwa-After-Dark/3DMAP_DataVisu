<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="0; url=./route-history/" />
    <title>3DMAP Data Visualization</title>
    <script>
      const destination = new URL("./route-history/", window.location.href);
      destination.search = window.location.search;
      destination.hash = window.location.hash;
      window.location.replace(destination);
    </script>
  </head>

    <p><a href="./route-history/">ルートヒストリー可視化サイトを開く</a></p>
  </body>
